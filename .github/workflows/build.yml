name: Validate TNAS package

on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/sync-and-release.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'tpk/**'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/sync-and-release.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'tpk/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Test API and package sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install package validation tools
        run: sudo apt-get update && sudo apt-get install -y gettext-base jq xz-utils
      - name: Run API regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Check shell syntax
        run: |
          bash -n scripts/build-tpk.sh
          bash -n tpk/scripts/install.sh
          bash -n tpk/scripts/remove.sh
      - name: Validate package metadata
        run: |
          TPK_VERSION=1.19.1.1 PLATFORM=x86_64 envsubst '${TPK_VERSION} ${PLATFORM}' < tpk/config.ini.template > /tmp/config.ini
          jq -e '.id == "cryptomator" and .type == "iframe" and .platform == "x86_64"' /tmp/config.ini
          jq -e 'type == "array" and length > 0' tpk/modules/index.json
      - name: Validate WebUI archive
        run: |
          tar -Jcf /tmp/webui.bz2 -C tpk/webui .
          tar -tf /tmp/webui.bz2 | grep -qx './index.html'
